name: build-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps
        run: |
          set -e
          brew install meson ninja lld libarchive
          brew install node@20 || true
          gem install xcodeproj --no-document
          node -v || true
          npm -v || true

      - name: Build emulator
        run: |
          set -e
          make emulator

      - name: Build rootfs
        run: |
          set -e
          make rootfs
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Regenerate project
        run: ruby scripts/gen-xcode-project.rb

      - name: Build unsigned app
        run: |
          set -e
          xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd build

      - name: Package unsigned IPA
        run: |
          set -e
          APP=build/dd/Build/Products/Release-iphoneos/DSH.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../DSH-unsigned.ipa Payload
          ls -lh ../DSH-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: build/DSH-unsigned.ipa
          if-no-files-found: error
